<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatty</title>
    <link rel="stylesheet" href="/css/chat.css">
</head>
<body>
    <div class="app" id="app">

        <!-- ── Sidebar ── -->
        <aside class="sidebar">
            <div class="header-content">
                <div class="user-info" id="currentUserProfile">
                    <div class="avatar" id="myAvatar">?</div>
                    <div>
                        <div class="name" id="myName">Loading...</div>
                        <div class="status">Online</div>
                    </div>
                </div>
                <button class="icon-btn logout-btn" id="logoutBtn" title="Log Out">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
            
            <!-- Settings Modal -->
            <div id="settingsModal" class="modal-overlay" style="display: none;">
                <div class="modal-content settings-modal">
                    <div class="modal-header">
                        <h2>Settings</h2>
                        <button id="closeSettingsBtn" class="btn-close">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="settings-avatar-wrapper">
                            <div class="settings-avatar" id="settingsAvatarPreview"></div>
                            <label class="avatar-upload-overlay" for="avatarUpload">
                                <span>📷</span>
                            </label>
                            <input type="file" id="avatarUpload" accept="image/png, image/jpeg, image/webp" style="display: none;">
                        </div>
                        
                        <form id="settingsForm" class="settings-form">
                            <div class="field">
                                <label>Username</label>
                                <input type="text" id="settingsUsername" disabled>
                            </div>
                            <div class="field">
                                <label>Display Name</label>
                                <input type="text" id="settingsDisplayName" required>
                            </div>
                            <div class="field">
                                <label>Bio</label>
                                <textarea id="settingsBio" placeholder="A few words about you..." rows="3"></textarea>
                            </div>
                            <button type="submit" class="btn-primary" id="saveSettingsBtn">Save Changes</button>
                            <button type="button" class="btn-danger" id="logoutBtn">Log Out</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍  Search users..." autocomplete="off">
            </div>
            <div class="conversation-list" id="conversationList">
                <div class="empty-state" id="noConversations">
                    <p>No conversations yet.</p>
                    <p class="hint">Search for a user to start chatting!</p>
                </div>
            </div>
        </aside>

        <!-- ── Chat Panel ── -->
        <main class="chat-panel">
            <!-- Empty state (no chat selected) -->
            <div class="no-chat" id="noChat">
                <div class="no-chat-content">
                    <div class="no-chat-icon">💬</div>
                    <h2>Welcome to Chatty</h2>
                    <p>Select a conversation or search for a user to start messaging.</p>
                </div>
            </div>

            <!-- Active chat view -->
            <div class="active-chat" id="activeChatEl" style="display: none;">
                <div class="chat-header">
                    <button class="btn-back" id="backBtn">←</button>
                    <div class="chat-partner-info">
                        <span class="partner-avatar" id="partnerAvatar"></span>
                        <div>
                            <div class="partner-name" id="partnerName"></div>
                            <div class="partner-status" id="partnerStatus">offline</div>
                        </div>
                    </div>
                </div>
                <div class="messages" id="messages"></div>
                <form class="message-form" id="messageForm">
                    <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
                    <button type="submit" id="sendBtn">➤</button>
                </form>
            </div>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/chat.js"></script>
</body>
</html>
