<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatty – Sign In</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">💬</div>
            <h1>Chatty</h1>
            <p class="subtitle">Fast. Simple. Secure messaging.</p>

            <!-- Tab Switcher -->
            <div class="tabs">
                <button class="tab active" data-tab="login">Sign In</button>
                <button class="tab" data-tab="register">Register</button>
            </div>

            <!-- Error Message -->
            <div id="error" class="error" style="display: none;"></div>

            <!-- Login Form -->
            <form id="loginForm" class="form">
                <div class="field">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter your username" required>
                </div>
                <div class="field">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="form" style="display: none;">
                <div class="field">
                    <label for="regUsername">Username</label>
                    <div class="input-with-btn">
                        <input type="text" id="regUsername" placeholder="Pick a unique username" required minlength="3" maxlength="20">
                        <button type="button" id="generateBtn" title="Generate random username">🎲</button>
                    </div>
                </div>
                <div class="field">
                    <label for="regDisplayName">Display Name <span class="optional">(optional)</span></label>
                    <input type="text" id="regDisplayName" placeholder="How others will see you">
                </div>
                <div class="field">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="At least 6 characters" required minlength="6">
                </div>
                <button type="submit" class="btn-primary">Create Account</button>
            </form>
        </div>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
